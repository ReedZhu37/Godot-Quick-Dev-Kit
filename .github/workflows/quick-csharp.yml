name: Quick Dev Kit C# integration
on:
  push:
    paths:
      - 'addons/**'
      - 'tests/**'
      - '*.csproj'
      - '*.md'
      - 'docs/**'
      - 'project.godot'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'addons/**'
      - 'tests/**'
      - '*.csproj'
      - '*.md'
      - 'docs/**'
      - 'project.godot'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    name: All C# modules and language labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Check language labels and documentation links
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: dotnet build QuickVfxDemo.csproj -c Debug -warnaserror
      - run: dotnet build QuickVfxDemo.csproj -c Release -warnaserror
  godot-validation:
    name: Manual full Godot regression
    if: github.event_name == 'workflow_dispatch'
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install official Godot .NET
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  /tmp/godot.zip" | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "GODOT=/tmp/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - run: python3 tests/run_quick_input.py --backend all --godot "$GODOT" --sdk-version 4.7.2 --framework net9.0
      - run: python3 tests/run_quick_audio.py --backend all --godot "$GODOT"
      - run: bash tests/quick_database/run.sh
      - run: bash tests/quick_vfx_manager/run.sh
      - run: GODOT_BIN="$GODOT" bash tests/quick_level_kit/run_csharp_tests.sh
      - run: GODOT_BIN="$GODOT" bash tests/quick_level_kit/editor_lifecycle_tests.sh
      - run: GODOT_BIN="$GODOT" bash tests/quick_level_kit/run_isolated_csharp.sh
